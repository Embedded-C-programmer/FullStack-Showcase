version: '3.9'

services:
  # ──────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: rag_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme_in_production
      MONGO_INITDB_DATABASE: rag_platform
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rag_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Python AI Service (FastAPI + FAISS)
  # ──────────────────────────────────────────
  python-ai:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: rag_python_ai
    restart: unless-stopped
    env_file: ./backend-python/.env
    ports:
      - "8000:8000"
    volumes:
      - faiss_indices:/app/faiss_indices
      - uploads_data:/app/uploads
    networks:
      - rag_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────
  # Node.js API (Express)
  # ──────────────────────────────────────────
  node-api:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: rag_node_api
    restart: unless-stopped
    env_file: ./backend-node/.env
    environment:
      MONGODB_URI: mongodb://admin:changeme_in_production@mongo:27017/rag_platform?authSource=admin
      PYTHON_SERVICE_URL: http://python-ai:8000
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      python-ai:
        condition: service_healthy
    networks:
      - rag_net

  # ──────────────────────────────────────────
  # React Frontend (served via Nginx)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - node-api
    networks:
      - rag_net

volumes:
  mongo_data:
  faiss_indices:
  uploads_data:

networks:
  rag_net:
    driver: bridge
